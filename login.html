<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion — Sentinel-X</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080e0c;color:#e9f2ed;font:16px Arial}main{width:min(340px,80vw);padding:36px;background:#131b18;border:1px solid #2b4939;border-radius:20px}small{letter-spacing:3px;color:#a8edc4}h1{font-size:28px}p{color:#9cb1a6;line-height:1.6}label{display:block;font-size:14px;margin:24px 0 10px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #42614e;border-radius:9px;background:#080e0c;color:white;font:inherit}button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:9px;background:#a8edc4;color:#102b1c;font:inherit;cursor:pointer}#error{color:#ff9292;font-size:14px}</style></head>
<body><main><small>SENTINEL-X</small><h1>Centre de contrôle</h1><p>Connecte-toi pour consulter les capteurs, la caméra et les commandes du boîtier.</p><form><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required autofocus><button>Se connecter</button><p id="error" role="alert"></p></form></main>
<script>document.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('button');button.disabled=true;try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(response.ok){location.replace('/');return;}document.getElementById('error').textContent=(await response.json()).detail;}catch{document.getElementById('error').textContent='API indisponible. Réessaie dans un instant.';}finally{button.disabled=false;}});</script></body></html>
